[package]
name = "rsomics-limma"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Ordinary expression and current voom linear-model analysis"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
libm = "0.2"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
rayon = "1"
rsomics-common = "=0.12.3"
rsomics-help = "=0.4.0"
rsomics-stats = "=0.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
statrs = { version = "=0.18.0", default-features = false }

[dev-dependencies]
tempfile = "3"

