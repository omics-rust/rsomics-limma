name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
          - target: macos-x86_64
            runner: macos-15-intel
            host: x86_64-apple-darwin
          - target: macos-aarch64
            runner: macos-15
            host: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      NATIVE_TARGET: ${{ matrix.target }}
      EXPECTED_HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare runner storage
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
          export RUSTUP_HOME="$RUNNER_TEMP/rustup-home"
          export TMPDIR="$RUNNER_TEMP/scratch"
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR" "$RUSTUP_HOME" "$TMPDIR" "$XDG_CACHE_HOME" "$RUNNER_TEMP/delivery"
          printf '%s\n' "CARGO_HOME=$CARGO_HOME" "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" \
            "RUSTUP_HOME=$RUSTUP_HOME" "TMPDIR=$TMPDIR" "XDG_CACHE_HOME=$XDG_CACHE_HOME" >> "$GITHUB_ENV"
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          for key in ('CARGO_HOME', 'CARGO_TARGET_DIR', 'RUSTUP_HOME', 'TMPDIR', 'XDG_CACHE_HOME'):
              path = Path(os.environ[key]).resolve(strict=True)
              assert path.is_relative_to(root), (key, path)
              print(key, path)
          PY
          git rev-parse HEAD
          uname -a
          df -h
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt
      - name: Verify native host and Cargo target
        run: |
          set -euo pipefail
          rustc -Vv
          test "$(rustc -Vv | sed -n 's/^host: //p')" = "$EXPECTED_HOST"
          cargo metadata --locked --no-deps --format-version 1 | python3 -B -c \
            'import json,os,sys; assert json.load(sys.stdin)["target_directory"] == os.environ["CARGO_TARGET_DIR"]'
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --release --locked --all-targets --all-features
      - if: matrix.target == 'linux-x86_64'
        run: cargo fmt --all -- --check
      - if: matrix.target == 'linux-x86_64'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - if: matrix.target == 'linux-x86_64'
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify complete source package
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/delivery/package-metadata.json"
          cargo package --locked --list > "$RUNNER_TEMP/delivery/package-files.txt"
          cargo package --locked > "$RUNNER_TEMP/delivery/package.stdout" 2> "$RUNNER_TEMP/delivery/package.stderr"
          python3 -B scripts/delivery.py source

      - name: Test packaged release
        run: cargo test --manifest-path "$PACKAGE_DIRECTORY/Cargo.toml" --release --locked --all-targets --all-features

      - name: Install and exercise packaged binary
        run: |
          set -euo pipefail
          cargo install --path "$PACKAGE_DIRECTORY" --locked --root "$RUNNER_TEMP/installed" \
            > "$RUNNER_TEMP/delivery/install.stdout" 2> "$RUNNER_TEMP/delivery/install.stderr"
          python3 -B "$PACKAGE_DIRECTORY/scripts/delivery.py" smoke --binary "$RUNNER_TEMP/installed/bin/rsomics-limma"

      - name: Assemble native delivery candidate
        run: python3 -B scripts/delivery.py bundle --binary "$RUNNER_TEMP/installed/bin/rsomics-limma"

      - name: Upload native and source candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsomics-limma-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
          retention-days: 30
